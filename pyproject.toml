[project]
name = "lunarsim"
version = "0.1.0"
description = "Reusable lunar terrain/sensor simulation library"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "rasterio",
    "skyfield",
    "gymnasium",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
viz = ["open3d"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lunarsim*"]
